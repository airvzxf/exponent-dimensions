name: Post-release validation

# Comprueba que producción sirve exactamente la versión del tag.
#
# Cloudflare Pages despliega src/ en cada push a main, así que cuando el
# tag existe el sitio ya debería servir el commit del release. Este
# workflow lo demuestra:
#   1. Cada archivo de src/ en el tag se descarga de producción y su
#      sha256 debe coincidir (con reintentos mientras termina el
#      despliegue).
#   2. La prueba de humo de CI se ejecuta contra el sitio real.
#
# Corre al terminar release.yml con éxito y también a mano:
#   gh workflow run post-release-validation.yml --ref main -f tag=v1.0.0
#
# Si main recibió cambios en src/ después del tag, el paso 1 falla con
# razón: producción ya no sirve esa versión.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to validate against production (e.g. v1.0.0).'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: post-release-${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  SITE_URL: https://exponent-dimensions.rovisoft.net/

jobs:
  resolve:
    name: 'Resolve · tag'
    # Una release fallida no tiene nada que validar.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.resolve.outputs.TAG }}
    steps:
      - name: Validate tag shape
        id: resolve
        env:
          # En workflow_run, head_branch es el nombre del tag que disparó release.yml.
          RAW: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          case "${RAW}" in
            *[![:print:]]*)
              echo "::error::the tag contains a non-printable character"
              exit 1
              ;;
          esac
          if ! printf '%s' "${RAW}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'${RAW}' is not vX.Y.Z (optionally -suffix)"
            exit 1
          fi
          echo "TAG=${RAW}" >> "$GITHUB_OUTPUT"

  production-files:
    name: 'Verify · production serves the tag'
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Compare every file in src/ with production
        run: |
          set -euo pipefail
          version="$(head -n1 VERSION | tr -d '[:space:]')"
          # Pages ignora el query string y responde a rutas inexistentes con
          # index.html y estado 200, así que se compara el contenido, no el
          # estado HTTP.
          # Hasta 10 minutos: el despliegue de Pages suele tardar menos de uno.
          for attempt in $(seq 1 20); do
            mismatches=0
            while IFS= read -r file; do
              path="${file#src/}"
              # Pages redirige /index.html a /, así que se pide la raíz.
              [ "${path}" = index.html ] && path=""
              # JS y CSS se piden con la URL que usa el navegador
              # (?v=<VERSION>), la que entra en su caché de un año.
              case "${path}" in
                *.js|*.css) path="${path}?v=${version}" ;;
              esac
              expected="$(sha256sum "${file}" | cut -d' ' -f1)"
              actual="$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "${SITE_URL}${path}" | sha256sum | cut -d' ' -f1)" || actual="download-failed"
              if [ "${expected}" != "${actual}" ]; then
                mismatches=$((mismatches + 1))
                echo "  ✗ ${file}"
              fi
            done < <(git ls-files src)
            if [ "${mismatches}" -eq 0 ]; then
              echo "✓ production serves every file of $(git ls-files src | wc -l) in src/ exactly as in the tag"
              exit 0
            fi
            echo "attempt ${attempt}/20: ${mismatches} file(s) differ; retrying in 30 s"
            sleep 30
          done
          echo "::error::production does not serve the files of the tag. Check the Cloudflare Pages deployment of main, or whether main changed src/ after the tag."
          exit 1

  production-smoke:
    name: 'Smoke test · production'
    needs: [resolve, production-files]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run the smoke test against production
        run: |
          CHROME_PATH="$(command -v google-chrome)"
          export CHROME_PATH
          BASE_URL="${SITE_URL}" make smoke
