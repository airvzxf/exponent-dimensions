name: Release

# Cinco jobs: validate-tag-input → (verify-tag-reachability ∥
# verify-tag-signature) → build → publish. Sigue la estructura de
# release.yml en airvzxf/ftp-deployment-action y airvzxf/moagan.
#
# El sitio lo publica Cloudflare Pages en cada push a main; este
# workflow no despliega nada. Fija la versión: comprueba que el tag es
# legítimo, empaqueta src/ tal como quedó en el commit del tag y crea la
# página de GitHub Release con la sección del CHANGELOG.
#
# Disparadores
# * push de un tag `vX.Y.Z` (con sufijo opcional, p. ej. `v1.1.0-rc.1`).
# * workflow_dispatch con el tag como texto; validate-tag-input revisa
#   su forma antes de usarlo.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. v1.0.0). It must already exist on the remote.'
        required: true
        type: string

# Una release por tag: dos ejecuciones del mismo tag no compiten al publicar.
concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

# Sin permisos globales: cada job declara solo los que necesita.

# Programa awk que imprime la sección del CHANGELOG para la versión `v`
# (awk -v v=X.Y.Z). Se define una vez para que la verificación y la
# extracción no puedan discrepar. Ignora `## [Unreleased]` y termina en el
# siguiente encabezado `## [...]` o en los enlaces de comparación del pie.
env:
  CHANGELOG_SECTION_AWK: |
    BEGIN {
        in_section = 0
        v_escaped = v
        gsub(/\./, "\\.", v_escaped)
        heading_re = "^## \\[" v_escaped "\\]( -.*)?$"
        next_heading_re = "^## \\["
        compare_re = "^\\[[0-9]+\\.[0-9]+\\.[0-9]+\\]:"
    }
    $0 ~ heading_re { in_section = 1; next }
    in_section && $0 ~ next_heading_re { exit }
    in_section && $0 ~ compare_re { exit }
    in_section { print }

jobs:
  # Job 1: rechaza pronto un tag mal formado. El filtro del push ya lo
  # limita, así que protege sobre todo la ruta workflow_dispatch, donde el
  # texto acaba dentro de comandos de shell.
  validate-tag-input:
    name: 'Validate · tag input'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.TAG }}
    steps:
      - name: Validate tag shape
        id: resolve
        env:
          RAW: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RAW}"
          # grep ancla ^ y $ por línea: primero se rechaza cualquier
          # carácter no imprimible (saltos de línea incluidos).
          case "${TAG}" in
            *[![:print:]]*)
              echo "::error::the tag contains a non-printable character"
              exit 1
              ;;
          esac
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'${TAG}' is not vX.Y.Z (optionally -suffix)"
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

  # Job 2: el tag debe apuntar a un commit alcanzable desde main (el
  # commit del squash merge, no la punta de la rama), con VERSION igual al
  # tag y una sección no vacía en el CHANGELOG. Ver AGENTS.md.
  verify-tag-reachability:
    name: 'Verify · tag is reachable from main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    outputs:
      tag_commit: ${{ steps.resolve.outputs.TAG_COMMIT }}
    steps:
      - name: Checkout at ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate-tag-input.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag commit and fetch main
        id: resolve
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          echo "tag=${TAG} tag_commit=${TAG_COMMIT} main_head=${MAIN_COMMIT}"
          {
            echo "TAG=${TAG}"
            echo "TAG_COMMIT=${TAG_COMMIT}"
            echo "MAIN_COMMIT=${MAIN_COMMIT}"
          } >> "$GITHUB_OUTPUT"

      # VERSION debe ser la versión del tag sin `v` ni sufijo:
      # v1.2.0 y v1.2.0-rc.1 necesitan ambos VERSION = 1.2.0.
      - name: Fail if VERSION at the tag commit differs from the tag
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
        run: |
          set -euo pipefail
          core="${TAG#v}"
          core="${core%%-*}"
          if ! raw="$(git show "${TAG_COMMIT}:VERSION")"; then
            echo "::error::VERSION is missing at ${TAG} (${TAG_COMMIT}); expected ${core}. Bump it in the release PR and re-tag."
            exit 1
          fi
          version="$(printf '%s\n' "${raw}" | sed -e '1!d' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ "${version}" != "${core}" ]; then
            echo "::error::VERSION at ${TAG} (${TAG_COMMIT}) is '${version}', expected '${core}'. Bump it in the release PR and re-tag."
            exit 1
          fi
          echo "✓ VERSION ${version} matches ${TAG}"

      # La página de la release es la sección [X.Y.Z] del CHANGELOG; no hay
      # notas generadas de respaldo.
      - name: Fail if CHANGELOG at the tag commit has no section for the version
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
        run: |
          set -euo pipefail
          core="${TAG#v}"
          core="${core%%-*}"
          if ! changelog="$(git show "${TAG_COMMIT}:CHANGELOG.md")"; then
            echo "::error::CHANGELOG.md is missing at ${TAG} (${TAG_COMMIT})."
            exit 1
          fi
          notes="$(awk -v v="${core}" "${CHANGELOG_SECTION_AWK}" <<< "${changelog}")"
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::CHANGELOG.md at ${TAG} (${TAG_COMMIT}) has no '## [${core}]' section, or it is empty."
            exit 1
          fi
          echo "✓ CHANGELOG.md has a non-empty [${core}] section"

      - name: Fail if the tag commit is not an ancestor of main
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
          MAIN_COMMIT: ${{ steps.resolve.outputs.MAIN_COMMIT }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "✓ ${TAG} (${TAG_COMMIT}) is reachable from origin/main (${MAIN_COMMIT})"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} points at ${TAG_COMMIT}, which is NOT an ancestor"
            echo "of origin/main (${MAIN_COMMIT}). It was probably created on a branch"
            echo "tip that the squash merge replaced."
            echo ""
            echo "Fix (delete the orphan tag, re-tag the merge commit on main):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git checkout main && git reset --hard origin/main"
            echo "  git tag -s ${TAG} -m 'release: ${TAG#v}' \$(git rev-parse origin/main)"
            echo "  git push origin ${TAG}"
          } >&2
          exit 1

  # Job 3: el tag debe estar firmado por una llave de
  # .github/trusted-signers. La lista se lee de origin/main, no del árbol
  # del tag: si se leyera del tag, revocar una llave no tendría efecto
  # porque el ancla de confianza sería el mismo objeto que se verifica.
  verify-tag-signature:
    name: 'Verify · tag is signed by a trusted signer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    outputs:
      verified_commit: ${{ steps.verify.outputs.VERIFIED_COMMIT }}
    steps:
      - name: Checkout at ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate-tag-input.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the allow-list from origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/trusted"
          git show "origin/main:.github/trusted-signers" > "$RUNNER_TEMP/trusted/allowed_signers"
          test -s "$RUNNER_TEMP/trusted/allowed_signers" \
            || { echo "::error::.github/trusted-signers is empty on origin/main"; exit 1; }
          git config gpg.format ssh
          git config gpg.ssh.allowedsignersfile "$RUNNER_TEMP/trusted/allowed_signers"

      - name: Verify the tag signature
        id: verify
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git verify-tag "refs/tags/${TAG}"; then
            {
              echo "ERROR: tag ${TAG} is not signed by a key in .github/trusted-signers"
              echo "(read from origin/main). Re-tag with the maintainer's SSH key:"
              echo "  git tag -d ${TAG} && git push origin :refs/tags/${TAG}"
              echo "  git tag -s ${TAG} -m 'release: ${TAG#v}' \$(git rev-parse origin/main)"
              echo "  git push origin ${TAG}"
            } >&2
            exit 1
          fi
          # git verify-tag no comprueba que la cabecera `tag` del objeto
          # firmado coincida con el ref: sin esto, un tag firmado antiguo
          # empujado con otro nombre pasaría.
          TAG_NAME="$(git cat-file tag "refs/tags/${TAG}" | sed -n '1,/^$/s/^tag //p')"
          if [ "${TAG_NAME}" != "${TAG}" ]; then
            echo "::error::the tag object is named '${TAG_NAME}' but was pushed as refs/tags/${TAG}"
            exit 1
          fi
          echo "✓ ${TAG} is signed by a trusted key"
          echo "VERIFIED_COMMIT=$(git rev-parse "refs/tags/${TAG}^{commit}")" >> "$GITHUB_OUTPUT"

  # Job 4: empaqueta src/ del commit inmutable del tag (no del ref, que
  # podría moverse con un force-push a mitad de la ejecución) y extrae las
  # notas del CHANGELOG.
  build:
    name: 'Build · site bundle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [validate-tag-input, verify-tag-reachability, verify-tag-signature]
    steps:
      - name: Fail if the two verify jobs saw different commits
        env:
          REACHABLE: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          SIGNED: ${{ needs.verify-tag-signature.outputs.verified_commit }}
        run: |
          set -euo pipefail
          if [ -z "${REACHABLE}" ] || [ "${REACHABLE}" != "${SIGNED}" ]; then
            echo "::error::reachability saw '${REACHABLE}' but the signature check saw '${SIGNED}'"
            exit 1
          fi

      - name: Checkout the tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          persist-credentials: false

      - name: Bundle src/ and extract the release notes
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          core="${version%%-*}"
          out="$RUNNER_TEMP/release"
          mkdir -p "${out}"
          # git archive empaqueta exactamente lo versionado en src/,
          # sin archivos locales ni del runner.
          name="exponent-dimensions-${version}"
          git archive --format=zip --prefix="${name}/" -o "${out}/${name}.zip" HEAD src
          (cd "${out}" && sha256sum "${name}.zip" > SHA256SUMS)
          cat "${out}/SHA256SUMS"
          awk -v v="${core}" "${CHANGELOG_SECTION_AWK}" CHANGELOG.md > "${out}/CHANGELOG.body.md"
          if [ -z "$(tr -d '[:space:]' < "${out}/CHANGELOG.body.md")" ]; then
            echo "::error::empty CHANGELOG section for ${core}"
            exit 1
          fi

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release/
          retention-days: 7
          if-no-files-found: error

  # Job 5: crea la página de la release. `contents: write` solo aquí.
  publish:
    name: 'Publish · GitHub Release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    needs: [validate-tag-input, build]
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release/

      - name: Extract metadata
        id: meta
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          # Delimitador aleatorio: una línea `EOF` en el CHANGELOG no
          # cortaría el valor antes de tiempo.
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "tag=${TAG}"
            echo "zip=release/exponent-dimensions-${TAG#v}.zip"
            echo "body<<${delim}"
            cat release/CHANGELOG.body.md
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          make_latest: ${{ !contains(steps.meta.outputs.tag, '-') }}
          body: ${{ steps.meta.outputs.body }}
          files: |
            ${{ steps.meta.outputs.zip }}
            release/SHA256SUMS
          fail_on_unmatched_files: true
