name: CI

# Disparadores: push a main, cualquier pull request y ejecución manual.
# Los tags no lo disparan: de ellos se encarga release.yml.
# Los jobs son independientes (ninguno declara `needs:`), así que corren
# en paralelo y un fallo en uno no oculta el resultado de los demás.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Una ejecución por ref. Los PR cancelan la ejecución anterior al recibir
# un push nuevo; main y las ejecuciones manuales no, para que un fallo
# quede visible en la pestaña Actions mientras llega la corrección.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Binario oficial verificado por sha256 en lugar de una acción
      # envoltorio. Al subir de versión hay que cambiar las dos líneas:
      # sha= es la entrada actionlint_<ver>_linux_amd64.tar.gz del archivo
      # actionlint_<ver>_checksums.txt de la release.
      - name: Install actionlint
        run: |
          set -eu
          ver=1.7.12
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          echo "${sha}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version
      - name: Run actionlint
        run: make actionlint

  html-validate:
    name: HTML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate src/index.html
        run: make html-validate

  js-check:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: node --check
        run: make js-check

  # Cada recurso local de index.html y cada import relativo entre
  # módulos lleva ?v=<VERSION> (ver README, "Versiones").
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: node --test
        run: make unit

  # Producción guarda JS y CSS un año en el navegador y Cloudflare Pages
  # publica en cuanto se fusiona el PR. Por eso un PR que cambia JS o CSS
  # de src/ debe subir VERSION (y con ella los ?v=) en el mismo PR.
  asset-version:
    name: Asset version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail if src/ JS or CSS changed without a version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          changed="$(git diff --name-only "${base}" "${HEAD_SHA}" -- 'src/*.js' 'src/*.css')"
          if [ -z "${changed}" ]; then
            echo "✓ no JavaScript or CSS changes in src/"
            exit 0
          fi
          old="$(git show "${base}:VERSION" 2>/dev/null | head -n1 | tr -d '[:space:]')" || old=""
          new="$(git show "${HEAD_SHA}:VERSION" | head -n1 | tr -d '[:space:]')"
          if [ "${old}" = "${new}" ]; then
            {
              echo "::error::src/ JavaScript or CSS changed but VERSION is still ${old}."
              echo "Changed files:"
              echo "${changed}"
              echo "Bump VERSION, the ?v= URLs in src/ and the CHANGELOG section in this PR; see README 'Versiones'."
            } >&2
            exit 1
          fi
          echo "✓ version ${old:-none} → ${new} for:"
          echo "${changed}"

  # Abre la app en el Chrome del runner: las cuatro dimensiones, la
  # vista 3D con WebGL (SwiftShader), corte, URL, idioma, teclado,
  # diseño móvil y el aviso cuando el CDN de Three.js no responde.
  smoke:
    name: Smoke test (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run the smoke test
        run: |
          CHROME_PATH="$(command -v google-chrome)"
          export CHROME_PATH
          "${CHROME_PATH}" --version
          make smoke

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Umbrales en lighthouserc.json: accesibilidad < 0.9 falla el job;
      # rendimiento, buenas prácticas y SEO solo avisan.
      - name: Run Lighthouse CI
        run: make lighthouse
      - name: Upload the Lighthouse report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          # .lighthouseci/ empieza con punto: sin esto upload-artifact lo
          # trata como oculto y no sube nada.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
