version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    # Commits convencionales: "ci(deps): bump ...", como en moagan.
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  # Solo la prueba de humo usa npm; el sitio no tiene dependencias npm.
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
    # Son dependencias de las pruebas: "test(deps): bump ...".
    commit-message:
      prefix: "test"
      include: "scope"
    groups:
      test-deps:
        patterns: ["*"]
